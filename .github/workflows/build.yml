# 승인된 교육 데이터 → 영상 렌더(변경분만) → 공개 사이트 배포
# 실행 조건: main 브랜치에 data/ assets/ renderer/ site/ scripts/ 변경이 들어올 때, 또는 Actions 탭에서 수동 실행
name: Build videos & site

on:
  push:
    branches: [main]
    paths: ["data/**", "assets/**", "renderer/**", "site/**", "scripts/build_site.py"]
  workflow_dispatch:
    inputs:
      all:
        description: "모든 영상 다시 렌더"
        type: boolean
        default: false

permissions:
  contents: write      # 렌더된 영상을 videos/ 에 커밋
  pages: write
  id-token: write

concurrency:            # 연속 푸시 시 앞 작업이 끝난 뒤 순서대로
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data (별표5 항목 누락·잘못된 키 → 여기서 중단)
        run: python3 renderer/validate.py data/*.json

      - name: System packages (ffmpeg, Korean fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          ls /usr/share/fonts/opentype/noto/NotoSansCJK-Black.ttc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      - run: pip install -r renderer/requirements.txt

      - name: Voice model cache (약 350MB — 한 번 받으면 재사용)
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          curl -sSfL -o models/voices-v1.0.bin  $base/voices-v1.0.bin

      - name: Render changed videos
        run: python3 renderer/render.py ${{ inputs.all && '--all' || '' }}

      - name: Commit rendered videos
        run: |
          git config user.name  "msds-bot"
          git config user.email "msds-bot@users.noreply.github.com"
          git add videos
          if git diff --cached --quiet; then echo "새 영상 없음"; else
            git commit -m "render: update training videos [skip ci]"
            git push
          fi

      - name: Build site
        run: python3 scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
