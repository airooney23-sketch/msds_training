<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSDS Safety Training</title>
<meta name="theme-color" content="#0B0D12">
<style>
  :root{
    --bg:#0B0D12; --panel:#151821; --line:#252A36; --text:#F3F4F6; --sub:#9CA3AF; --accent:#F59E0B;
    --danger:#EF4444; --chip:#1E2330; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}
  .brand small{display:block;color:var(--sub);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
  .brand b{font-size:24px;letter-spacing:-.01em}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--chip);
    border:1px solid var(--line);font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#3A4152}
  .search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:16px;outline:none;margin-bottom:18px}
  .search:focus{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;gap:14px;padding:14px;transition:border-color .15s, transform .15s}
  .card:hover{border-color:#3A4152;transform:translateY(-1px)}
  .thumb{width:72px;aspect-ratio:9/16;border-radius:10px;object-fit:cover;background:#000;flex:none}
  .card h3{margin:0;font-size:17px;line-height:1.3}
  .card .ko{color:var(--sub);font-size:14px}
  .meta{color:var(--sub);font-size:13px;margin-top:6px}
  .pics{display:flex;gap:4px;margin-top:8px}
  .pics img{width:30px;height:30px}
  .sig{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--danger);color:#fff;margin-top:8px}
  .sig.warn{background:#D97706}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  /* 상세 */
  .detail{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:24px;align-items:start}
  video{width:100%;aspect-ratio:9/16;background:#000;border-radius:var(--radius);display:block}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .panel h2{margin:0 0 2px;font-size:26px;letter-spacing:-.01em}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-top:12px}
  .kv span:nth-child(odd){color:var(--sub)}
  .cues{max-height:420px;overflow:auto;margin:0;padding:0;list-style:none}
  .cues li{padding:10px 10px;border-radius:10px;cursor:pointer;font-size:14px}
  .cues li:hover{background:var(--chip)}
  .cues li.on{background:#2A2414;outline:1px solid #5C4A1A}
  .cues .t{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
  .cues .k{color:#FCD34D}
  .qrbox{display:flex;gap:14px;align-items:center}
  .qrbox canvas,.qrbox img{border-radius:8px;background:#fff;padding:6px}
  @media (max-width:720px){ .detail{grid-template-columns:1fr} }
  /* QR 인쇄 시트 */
  body.print{background:#fff;color:#111}
  .sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10mm;padding:10mm}
  .tag{border:1.5px solid #111;border-radius:6mm;padding:5mm;text-align:center;break-inside:avoid}
  .qr{display:flex;justify-content:center}
  .tag b{display:block;font-size:15px;margin-top:3mm}
  .tag .ko{color:#444;font-size:13px}
  .tag .pics{justify-content:center}
  .tag .hint{font-size:10px;color:#555;margin-top:2mm}
  @media print{ .noprint{display:none} .sheet{padding:0} }
  @media (max-width:720px){ .sheet{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px} .tag{padding:12px} }
</style>
</head>
<body>
<div id="app"></div>

<!-- QR 생성 라이브러리: qrcode-generator 1.4.4 (MIT) — 사이트에 직접 포함해 외부 CDN 차단 환경에서도 동작 -->
<script src="qrcode.js"></script>
<script>
/* 빌드 시 scripts/build_site.py 가 아래 자리에 물질 목록을 넣는다 */
const DATA = /*__DATA__*/[];
const app = document.getElementById("app");
const ICONS = /*__ICONS__*/{};   // renderer/icons.json 의 그림문자 파일 대응표
const PIC = p => `assets/${ICONS[p]}.png`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const baseUrl = () => location.origin + location.pathname;
const sigTag = m => `<span class="sig ${m.signal_word === "Warning" ? "warn" : ""}">${m.signal_word === "Warning" ? "WARNING · 경고" : "DANGER · 위험"}</span>`;
const pics = m => `<div class="pics">${m.pictograms.map(p => `<img src="${PIC(p)}" alt="${p}">`).join("")}</div>`;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function list() {
  document.body.className = ""; document.documentElement.style.background = "";
  app.innerHTML = `<div class="wrap">
    <header>
      <div class="brand"><small>MSDS Safety Training</small><b>물질안전 교육영상</b></div>
      <a class="btn noprint" href="?qr=all">QR 인쇄</a>
    </header>
    <input class="search" id="q" placeholder="물질명 또는 CAS 번호 검색" autocomplete="off">
    <div class="grid" id="grid"></div>
  </div>`;
  const grid = document.getElementById("grid"), q = document.getElementById("q");
  const draw = () => {
    const k = q.value.trim().toLowerCase();
    const rows = DATA.filter(m => !k || [m.name_en, m.name_ko, m.cas].join(" ").toLowerCase().includes(k));
    grid.innerHTML = rows.map(m => `
      <a class="card" href="?id=${encodeURIComponent(m.id)}">
        <img class="thumb" src="videos/${m.id}.jpg" alt="" loading="lazy">
        <div>
          <h3>${esc(m.name_en)}</h3><div class="ko">${esc(m.name_ko)}</div>
          <div class="meta">CAS ${esc(m.cas)} · ${fmt(m.duration)}</div>
          ${pics(m)}${sigTag(m)}
        </div>
      </a>`).join("") || `<div class="empty">검색 결과가 없습니다</div>`;
  };
  q.oninput = draw; draw();
}

function detail(m) {
  document.body.className = "";
  document.title = `${m.name_en} · MSDS Training`;
  app.innerHTML = `<div class="wrap">
    <header><a class="btn" href="./">← 목록</a><a class="btn" href="?qr=${encodeURIComponent(m.id)}">QR 인쇄</a></header>
    <div class="detail">
      <video id="v" src="videos/${m.id}.mp4" poster="videos/${m.id}.jpg" controls playsinline preload="metadata"></video>
      <div>
        <div class="panel">
          <h2>${esc(m.name_en)}</h2><div class="ko" style="color:var(--sub)">${esc(m.name_ko)}</div>
          ${pics(m)}${sigTag(m)}
          <div class="kv">
            <span>CAS No.</span><span>${esc(m.cas)}</span>
            <span>공급사</span><span>${esc(m.msds.supplier)}</span>
            <span>MSDS 개정일</span><span>${esc(m.msds.revision_date)}</span>
            <span>교육자료 승인일</span><span>${esc(m.approved_at)}</span>
            <span>영상 길이</span><span>${fmt(m.duration)}</span>
          </div>
        </div>
        <div class="panel"><b>스크립트</b> <span style="color:var(--sub);font-size:13px">· 누르면 해당 장면으로 이동</span>
          <ul class="cues" id="cues">${m.cues.map((c, i) => `
            <li data-i="${i}"><div class="t">${fmt(c.start)}</div><div>${esc(c.en)}</div><div class="k">${esc(c.ko)}</div></li>`).join("")}
          </ul>
        </div>
      </div>
    </div>
  </div>`;
  const v = document.getElementById("v"), items = [...document.querySelectorAll("#cues li")];
  items.forEach(li => li.onclick = () => { v.currentTime = m.cues[li.dataset.i].start + .05; v.play(); });
  v.ontimeupdate = () => {   // 재생 위치에 맞춰 현재 문장 강조
    const i = m.cues.findIndex(c => v.currentTime >= c.start && v.currentTime < c.end);
    items.forEach((li, j) => li.classList.toggle("on", j === i));
  };
}

function qrSheet(ids) {
  document.body.className = "print"; document.documentElement.style.background = "#fff";
  const rows = ids === "all" ? DATA : DATA.filter(m => m.id === ids);
  app.innerHTML = `<div class="noprint" style="padding:16px;display:flex;gap:8px">
      <a class="btn" style="background:#eee;color:#111;border-color:#ccc" href="./">← 목록</a>
      <button class="btn" style="background:#111" onclick="print()">인쇄</button></div>
    <div class="sheet">${rows.map(m => `
      <div class="tag"><div class="qr" data-id="${m.id}"></div>
        <b>${esc(m.name_en)}</b><div class="ko">${esc(m.name_ko)}</div>${pics(m)}
        <div class="hint">Scan for safety training · 스캔하여 교육영상 시청</div></div>`).join("")}
    </div>`;
  document.querySelectorAll(".qr").forEach(el => {
    const qr = qrcode(0, "M");                       // 0 = 데이터 길이에 맞춰 크기 자동
    qr.addData(`${baseUrl()}?id=${el.dataset.id}`); qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    el.firstChild.setAttribute("style", "width:100%;max-width:38mm;height:auto");
  });
}

const p = new URLSearchParams(location.search);
if (p.get("qr")) qrSheet(p.get("qr"));
else if (p.get("id")) { const m = DATA.find(x => x.id === p.get("id")); m ? detail(m) : list(); }
else list();
</script>
</body>
</html>
